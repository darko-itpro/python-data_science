[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pyschoolscience"
version = "0.1.0.dev1"
description = "Un projet destiné à illustrer l'usage d'un projet Data Science."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "jupyterlab>=4.5.8",
    "matplotlib>=3.11.0",
    "numpy>=2.4.6",
    "pandas>=3.0.3",
]

[project.optional-dependencies]
webdemo = [
    "plotly>=6.8.0",
    "streamlit>=1.58.0",
    "yfinance>=1.4.1",
]
wip = [
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
]

[tool.setuptools.packages.find]
where = ["src"]
